<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>競技かるた 暗記＆配置トレーニング</title>
  <style>
    :root {
      --tatami-bg: #d4b277;
      --tatami-border: #4a3319;
      --card-bg: #fffdf5;
      --card-border: #1a4314;
      --text-color: #111;
      --grid-border: rgba(80, 50, 15, 0.25);
      --selected: #ff8c00;
      --drop-zone: #4caf50;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 8px;
      background-color: #1a1a1a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      touch-action: manipulation;
    }

    h1 {
      margin: 4px 0 8px 0;
      font-size: 1.2rem;
      text-align: center;
    }

    /* ツールバー */
    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 8px;
      background: #2a2a2a;
      padding: 8px 12px;
      border-radius: 8px;
      width: 100%;
      max-width: 1100px;
    }

    button {
      background: #2e7d32;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      transition: background 0.2s, transform 0.1s;
      touch-action: manipulation;
    }

    button:active { opacity: 0.8; transform: scale(0.96); }
    button.secondary { background: #555; }
    button.action { background: #c62828; }
    button.shift-btn { background: #e65100; padding: 6px 12px; }

    /* 畳の盤面コンテナ (完全サイズ一致) */
    .board-container {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .board {
      background-color: var(--tatami-bg);
      border: 8px solid var(--tatami-border);
      border-radius: 8px;
      padding: 8px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
    }

    .field-section {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
    }

    .section-header {
      color: #3d2b0f;
      font-weight: bold;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 6px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 4px;
    }

    .align-btns {
      display: flex;
      gap: 4px;
    }

    .align-btns button {
      padding: 3px 8px;
      font-size: 0.7rem;
      background: #6a4f28;
      border-radius: 4px;
    }

    /* 自陣・相手陣完全均等の15列グリッド */
    .row-grid {
      display: grid;
      grid-template-columns: repeat(15, 1fr);
      gap: 2px;
      background: rgba(0, 0, 0, 0.08);
      padding: 2px;
      border-radius: 4px;
      width: 100%;
    }

    .slot {
      aspect-ratio: 0.68; /* 札の競技比率に固定 */
      border: 1px dashed var(--grid-border);
      border-radius: 3px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background: rgba(255, 255, 255, 0.12);
      transition: background 0.15s;
    }

    .slot.drag-over {
      background: rgba(76, 175, 80, 0.4);
      border: 1.5px solid var(--drop-zone);
    }

    /* かるたの札デザイン */
    .card {
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 2px;
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1px;
      box-shadow: 1px 1px 4px rgba(0,0,0,0.3);
      position: relative;
      font-size: clamp(0.5rem, 1.4vw, 0.95rem);
      font-weight: bold;
      writing-mode: vertical-rl;
      text-orientation: upright;
      letter-spacing: 0.5px;
      line-height: 1.05;
      font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif;
      cursor: grab;
      touch-action: none; /* ドラッグ操作用にブラウザ標準動作を抑制 */
    }

    .card:active {
      cursor: grabbing;
    }

    .enemy-field .card-text {
      transform: rotate(180deg);
    }

    .card.back {
      background: #1e4620;
      border: 1.5px solid #fff;
    }

    .card.back .card-text {
      display: none;
    }

    .card.selected {
      outline: 3px solid var(--selected);
      box-shadow: 0 0 8px var(--selected);
      z-index: 2;
    }

    .center-divider {
      height: 4px;
      background: var(--tatami-border);
      opacity: 0.7;
      margin: 2px 0;
      border-radius: 2px;
    }

    /* コントロールエリア */
    .controls-bottom {
      margin-top: 10px;
      width: 100%;
      max-width: 1100px;
      background: #2a2a2a;
      padding: 10px 14px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .deck-and-shift {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .deck-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .deck-card {
      width: 46px;
      height: 64px;
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 3px;
      color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.75rem;
      writing-mode: vertical-rl;
      font-weight: bold;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.5);
      font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif;
      cursor: grab;
      touch-action: none;
    }

    .shift-controls {
      display: flex;
      gap: 6px;
      align-items: center;
      background: #1a1a1a;
      padding: 6px 10px;
      border-radius: 6px;
    }

    .status-text {
      font-size: 0.85rem;
      color: #ffb74d;
      font-weight: bold;
      text-align: center;
    }

    /* ドラッグ時の追従要素 */
    .drag-ghost {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.85;
      transform: translate(-50%, -50%) scale(1.1);
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <h1>競技かるた 暗記＆配置トレーニング</h1>

  <div class="toolbar">
    <button onclick="initGame()">新しく並べる (50枚)</button>
    <button class="secondary" onclick="resetSelfBoard()">自陣リセット</button>
    <button class="secondary" onclick="autoPlaceSelf()">おまかせ配置</button>
    <button class="action" id="start-btn" onclick="toggleMemorizeMode()">暗記スタート (裏返す)</button>
  </div>

  <div class="board-container">
    <div class="board">
      <!-- 相手陣 (上段/中段/下段) -->
      <div class="field-section enemy-field">
        <div class="section-header">
          <span>相手陣 (完全自動配置)</span>
          <div class="align-btns">
            <span>上:</span>
            <button onclick="alignEnemyRow(0, 'left')">左</button>
            <button onclick="alignEnemyRow(0, 'right')">右</button>
            <span>中:</span>
            <button onclick="alignEnemyRow(1, 'left')">左</button>
            <button onclick="alignEnemyRow(1, 'right')">右</button>
            <span>下:</span>
            <button onclick="alignEnemyRow(2, 'left')">左</button>
            <button onclick="alignEnemyRow(2, 'right')">右</button>
          </div>
        </div>
        <div class="row-grid" id="enemy-row-0"></div>
        <div class="row-grid" id="enemy-row-1"></div>
        <div class="row-grid" id="enemy-row-2"></div>
      </div>

      <div class="center-divider"></div>

      <!-- 自陣 (上段/中段/下段) -->
      <div class="field-section self-field">
        <div class="section-header">
          <span>自陣 (スライド・ドラッグで配置)</span>
        </div>
        <div class="row-grid" id="self-row-0"></div>
        <div class="row-grid" id="self-row-1"></div>
        <div class="row-grid" id="self-row-2"></div>
      </div>
    </div>
  </div>

  <div class="controls-bottom">
    <div class="deck-and-shift">
      <div class="deck-area">
        <div class="deck-card" id="current-deck-card">束</div>
        <div style="font-size:0.85rem;">
          <div>手札山札: <span id="deck-count">25</span> 枚</div>
          <div style="font-size:0.7rem; color:#aaa;">指でドラッグして自陣へ移動</div>
        </div>
      </div>

      <div class="shift-controls">
        <span style="font-size:0.75rem; color:#aaa;">自陣寄せ操作:</span>
        <button class="shift-btn" onclick="shiftSelfGroup('left')">← 左寄せ</button>
        <button class="shift-btn" onclick="shiftSelfGroup('right')">右寄せ →</button>
      </div>
    </div>

    <div class="status-text" id="status-msg">手札または自陣の札をドラッグして動かしてね</div>
  </div>

  <script>
    // 百人一首 100首データ（上の句 / 下の句）
    const RAW_DATA = [
      [1,"あきのたの","わかころもてはつゆにぬれつつ"],[2,"はるすきて","ころもほすてふあまのかくやま"],
      [3,"あしひきの","ながながしよをひとりかもねむ"],[4,"たこのうらに","ふしのたかねにゆきはふりつつ"],
      [5,"おくやまに","こえきくときそあきはかなしき"],[6,"かささきの","しろきをみれはそそふけにける"],
      [7,"あまのはら","ふりさけみれはかすかになるの"],[8,"わかいほは","みやこのたつみしかそすむとおう"],
      [9,"はなさのくは","わかみなからになをおいにはて"],[10,"これやこの","しるもしらぬもあふさかのせき"],
      [11,"わたのはらや","くもゐにまかふおきつしらなみ"],[12,"あまつかせ","をとめのすかたしばしとどめむ"],
      [13,"つくはねの","みみたのふちとなりにけるかな"],[14,"みちのくの","みたれるのちのわたしはならむ"],
      [15,"きみかためは","わかころもてにゆきはふりつつ"],[16,"たちわかれ","まつとしきかばいまかへりこむ"],
      [17,"ちはやふる","からくれなゐにみづくくるとは"],[18,"すみのえの","ゆめのかよいじひとはよくれど"],
      [19,"なにわかた","みをつくしてもあはむとぞおもう"],[20,"わびぬれば","あはでこのよをすぐしてよとや"],
      [21,"いまこむと","ありあけのつきをまちいでつるかな"],[22,"ふくからに","むべやまかぜをあらしというらむ"],
      [23,"つきみれば","わがみひとつのあきにはあらねど"],[24,"このたびは","もみじのにしきかみのまにまに"],
      [25,"なにわえの","みじかきあしのふしのまの"],[26,"おぐらやま","いまひとたびのよくもがな"],
      [27,"みかのはら","いつみきとてかこいしかるらむ"],[28,"やまざとは","ひとめもくさもかれぬとおもえば"],
      [29,"こころあてに","おきまどわせるしらぎくのはな"],[30,"ありあけの","あかずわかれしあかつきばかり"],
      [31,"あさぼらけあ","よしのにふれるゆきかとぞみる"],[32,"やまがわに","ながれもあえぬもみじなりけり"],
      [33,"ひさかたの","しずころもなくてはなさくらむ"],[34,"たれをかも","たかさごのおのまつもむかしの"],
      [35,"ひとはいさ","はなぞむかしのかににおいける"],[36,"なつのよは","くものいずこにつきやどるらむ"],
      [37,"しらゆきに","ふりしきりたるあきののべかな"],[38,"わすらるる","ひとのいのちの惜しくもあるかな"],
      [39,"あさじうの","あまりてなどかひとのこいしき"],[40,"しのぶれど","ものやおもうとひとのとうまで"],
      [41,"こいすちょう","わがなはまだきたちにけるかな"],[42,"ちぎりきな","すえのまつちなくならむ"],
      [43,"あいみての","むかしはものを思わざりけり"],[44,"おうことも","ひとをみをつらさのおもうかな"],
      [45,"あわれとも","みをつくしてやみをはてぬらむ"],[46,"ゆらのとを","ゆくへも知らぬこいのみちかな"],
      [47,"やえむぐら","ひとこそ見えねあきはきにけり"],[48,"かぜをいたみ","くだけてものを思ふころかな"],
      [49,"みかきもり","昼は消えつつものをこそ思え"],[50,"きみがためお","ながくもがなと思いけるかな"],
      [51,"かくとだに","さしものぐさのさしもじはじ"],[52,"あけぬれば","なおうらめしきあさぼらけかな"],
      [53,"なげきつつ","ひとりぬるよのあくるまは"],[54,"わすれじの","ゆくすえまではかたければ"],
      [55,"たきのおとは","たえてのちひさふりぬれど"],[56,"あらざらむ","いまひとたびのあうこともがな"],
      [57,"めぐりあいて","つきかげかくれてみえざりしかな"],[58,"ありまやま","いでそよひとはわすれやはする"],
      [59,"やすらわで","かたぶくまでのつきをみしかな"],[60,"おおえやま","まだふみもみずあまのはしだて"],
      [61,"いにしえの","きょうここのえににおいぬるかな"],[62,"よをこめて","よしののせきはゆるさざりけり"],
      [63,"いまはただ","いつわりならでいいやめるかな"],[64,"あさぼらけう","あられふりおくるあじろぎのなみ"],
      [65,"うらみわび","こいじにくちんとなの惜しくもある"],[66,"もろともに","はなよりほかに知る人もなし"],
      [67,"はるのよの","かいなくたたむなこそ惜しけれ"],[68,"こころにも","おくやまのつきをかなしと見しかな"],
      [69,"あらしふく","たつたのやまのもみじばふりぬ"],[70,"さびしさに","いづこもおなじあきのゆうぐれ"],
      [71,"ゆうされば","おきのたのいほにこおろぎぞなき"],[72,"おとにきく","かけじやそでのぬれもこそすれ"],
      [73,"たかさごの","とうのたかねにゆきはふりつつ"],[74,"うかりける","はつせのやまのおろしはげしも"],
      [75,"ちぎりおきし","あわれことしのあきもいぬめり"],[76,"わたのはらこ","くもゐにまかふおきつしらなみ"],
      [77,"せをはやみ","われてもすえにあわむとぞおもう"],[78,"淡路島","いくよざめざめすまのせきもり"],
      [79,"秋かぜに","もれづるつきのつらさとも見ず"],[80,"ながからむ","みだれてけさはものをこそ思え"],
      [81,"ほとのへに","ながめせしまにふりぬるものを"],[82,"おもいやる","こころのうちはしるひとぞなき"],
      [83,"世の中よ","みちこそなけれおもうには"],[84,"長ならむ","こころの底のしらぬものから"],
      [85,"夜もすがら","もの思うころはあけやらで"],[86,"なげけとて","つきやはものを思わせる"],
      [87,"むらさめの","つゆもまだひぬまきの葉に"],[88,"なにわえの","みじかきあしのふしのまの"],
      [89,"玉の緒よ","たえなばたえねながらえば"],[90,"みせばやな","おじまのあまのそでだにも"],
      [91,"きりぎりす","なくやしもよのさむき夜に"],[92,"わがそでは","しおひにみえぬおきのいし"],
      [93,"世の中は","つねにもがもななぎさこぐ"],[94,"みつのうらの","なみにアイデアをよせかける"],
      [95,"おおかたは","つきをもめでじこれまでに"],[96,"花さそう","あらしののちのきのうかな"],
      [97,"こぬ人を","まつほのうらのゆうなぎに"],[98,"風そよぐ","ならの小川のゆうぐれは"],
      [99,"ひともよし","ひともうらめしあじきなく"],[100,"もとしきや","ふるきろきよのしのぶかな"]
    ];

    const HYAKUNIN_ISSHU = RAW_DATA.map(d => ({ id: d[0], kami: d[1], shimo: d[2] }));

    // 盤面データ構造
    let enemyBoard = Array(3).fill(null).map(() => Array(15).fill(null));
    let selfBoard = Array(3).fill(null).map(() => Array(15).fill(null));
    let selfDeck = [];
    let currentCard = null;
    let selectedSlot = null;
    let isMemorizeMode = false;

    // ドラッグ状態
    let dragData = null; // { source: 'deck'|'self', card: Object, r: number, c: number }
    let dragGhost = null;

    function initGame() {
      isMemorizeMode = false;
      selectedSlot = null;
      document.getElementById('start-btn').textContent = "暗記スタート (裏返す)";

      // ランダムに50枚抽出（25枚相手陣、25枚自陣用）
      const shuffled = [...HYAKUNIN_ISSHU].sort(() => Math.random() - 0.5);
      const selected50 = shuffled.slice(0, 50);

      const enemyCards = selected50.slice(0, 25);
      selfDeck = selected50.slice(25, 50);

      enemyBoard = Array(3).fill(null).map(() => Array(15).fill(null));
      selfBoard = Array(3).fill(null).map(() => Array(15).fill(null));

      // 相手陣に25枚ランダム配置
      let placed = 0;
      while (placed < 25) {
        let r = Math.floor(Math.random() * 3);
        let c = Math.floor(Math.random() * 15);
        if (!enemyBoard[r][c]) {
          enemyBoard[r][c] = { ...enemyCards[placed], isFaceDown: false };
          placed++;
        }
      }

      popDeckCard();
      renderAll();
      updateStatus("手札または自陣の札をドラッグして置けるよ");
    }

    function popDeckCard() {
      if (selfDeck.length > 0) {
        currentCard = selfDeck.pop();
        const deckEl = document.getElementById('current-deck-card');
        deckEl.textContent = currentCard.shimo;
        deckEl.style.display = 'flex';
      } else {
        currentCard = null;
        const deckEl = document.getElementById('current-deck-card');
        deckEl.textContent = "完了";
      }
      document.getElementById('deck-count').textContent = selfDeck.length + (currentCard ? 1 : 0);
    }

    function renderAll() {
      renderGrid('enemy', enemyBoard);
      renderGrid('self', selfBoard);
      setupDragEvents();
    }

    function renderGrid(side, boardData) {
      for (let r = 0; r < 3; r++) {
        const rowEl = document.getElementById(`${side}-row-${r}`);
        rowEl.innerHTML = '';
        for (let c = 0; c < 15; c++) {
          const slot = document.createElement('div');
          slot.className = 'slot';
          slot.dataset.side = side;
          slot.dataset.r = r;
          slot.dataset.c = c;

          const cardData = boardData[r][c];
          if (cardData) {
            const card = document.createElement('div');
            card.className = `card ${cardData.isFaceDown ? 'back' : ''}`;
            card.dataset.side = side;
            card.dataset.r = r;
            card.dataset.c = c;

            if (side === 'self' && selectedSlot && selectedSlot.r === r && selectedSlot.c === c) {
              card.classList.add('selected');
            }

            const text = document.createElement('div');
            text.className = 'card-text';
            text.textContent = cardData.shimo;
            card.appendChild(text);

            slot.appendChild(card);
          }
          rowEl.appendChild(slot);
        }
      }
    }

    // ドラッグ＆スライド統合処理 (Touch & Mouse両対応)
    function setupDragEvents() {
      // 山札のドラッグ設定
      const deckEl = document.getElementById('current-deck-card');
      if (currentCard && !isMemorizeMode) {
        attachDragSource(deckEl, { source: 'deck' });
      }

      // 自陣札のドラッグ設定
      document.querySelectorAll('.self-field .card').forEach(cardEl => {
        if (!isMemorizeMode) {
          const r = parseInt(cardEl.dataset.r);
          const c = parseInt(cardEl.dataset.c);
          attachDragSource(cardEl, { source: 'self', r, c });
        }
      });

      // タップ（裏返し/選択操作）用イベント
      document.querySelectorAll('.slot').forEach(slotEl => {
        slotEl.onclick = (e) => handleSlotClick(slotEl.dataset.side, parseInt(slotEl.dataset.r), parseInt(slotEl.dataset.c));
      });
    }

    function attachDragSource(element, sourceInfo) {
      const handleStart = (e) => {
        if (isMemorizeMode) return;
        const touch = e.touches ? e.touches[0] : e;

        if (sourceInfo.source === 'deck') {
          if (!currentCard) return;
          dragData = { source: 'deck', card: currentCard };
        } else if (sourceInfo.source === 'self') {
          const card = selfBoard[sourceInfo.r][sourceInfo.c];
          if (!card) return;
          dragData = { source: 'self', card, r: sourceInfo.r, c: sourceInfo.c };
        }

        // 追従ゴースト要素作成
        dragGhost = element.cloneNode(true);
        dragGhost.classList.add('drag-ghost');
        document.body.appendChild(dragGhost);
        moveGhost(touch.clientX, touch.clientY);

        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);
        window.addEventListener('touchmove', handleMove, { passive: false });
        window.addEventListener('touchend', handleEnd);
      };

      element.addEventListener('mousedown', handleStart);
      element.addEventListener('touchstart', handleStart, { passive: false });
    }

    function moveGhost(x, y) {
      if (dragGhost) {
        dragGhost.style.left = `${x}px`;
        dragGhost.style.top = `${y}px`;
      }
    }

    function handleMove(e) {
      if (!dragData) return;
      if (e.cancelable) e.preventDefault();
      const touch = e.touches ? e.touches[0] : e;
      moveGhost(touch.clientX, touch.clientY);

      // ドロップ先のハイライト処理
      document.querySelectorAll('.slot').forEach(s => s.classList.remove('drag-over'));
      const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
      if (targetEl) {
        const slot = targetEl.closest('.slot');
        if (slot && slot.dataset.side === 'self') {
          slot.classList.add('drag-over');
        }
      }
    }

    function handleEnd(e) {
      if (!dragData) return;
      const touch = e.changedTouches ? e.changedTouches[0] : e;

      document.querySelectorAll('.slot').forEach(s => s.classList.remove('drag-over'));
      if (dragGhost) {
        dragGhost.remove();
        dragGhost = null;
      }

      const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
      if (targetEl) {
        const slot = targetEl.closest('.slot');
        if (slot && slot.dataset.side === 'self') {
          const targetR = parseInt(slot.dataset.r);
          const targetC = parseInt(slot.dataset.c);
          executeDrop(targetR, targetC);
        }
      }

      dragData = null;
      window.removeEventListener('mousemove', handleMove);
      window.removeEventListener('mouseup', handleEnd);
      window.removeEventListener('touchmove', handleMove);
      window.removeEventListener('touchend', handleEnd);
    }

    function executeDrop(targetR, targetC) {
      if (dragData.source === 'deck') {
        const existingCard = selfBoard[targetR][targetC];
        selfBoard[targetR][targetC] = { ...dragData.card, isFaceDown: false };

        if (existingCard) {
          // すでに札がある場合はその位置に入れ替え、余りを山札に戻すか置換
          selfDeck.push(existingCard);
        }
        popDeckCard();
        updateStatus("自陣に配置しました");
      } else if (dragData.source === 'self') {
        const { r: srcR, c: srcC, card } = dragData;
        if (srcR === targetR && srcC === targetC) return;

        const targetCard = selfBoard[targetR][targetC];
        selfBoard[targetR][targetC] = card;
        selfBoard[srcR][srcC] = targetCard; // 入れ替えまたは空スロット移動

        updateStatus("札を移動・入れ替えました");
      }
      selectedSlot = null;
      renderAll();
    }

    function handleSlotClick(side, r, c) {
      if (isMemorizeMode) {
        const targetBoard = side === 'enemy' ? enemyBoard : selfBoard;
        if (targetBoard[r][c]) {
          targetBoard[r][c].isFaceDown = !targetBoard[r][c].isFaceDown;
          renderAll();
        }
        return;
      }

      if (side === 'self') {
        const card = selfBoard[r][c];
        if (card) {
          if (selectedSlot && selectedSlot.r === r && selectedSlot.c === c) {
            selectedSlot = null;
            updateStatus("選択を解除しました");
          } else {
            selectedSlot = { r, c };
            updateStatus("札を選択中（寄せ操作が可能）");
          }
        } else {
          selectedSlot = null;
        }
        renderAll();
      }
    }

    // 相手陣段一括左右寄せ
    function alignEnemyRow(rowIdx, direction) {
      const row = enemyBoard[rowIdx];
      const cards = row.filter(c => c !== null);
      const newRow = Array(15).fill(null);

      if (direction === 'left') {
        for (let i = 0; i < cards.length; i++) newRow[i] = cards[i];
      } else {
        for (let i = 0; i < cards.length; i++) newRow[15 - cards.length + i] = cards[i];
      }

      enemyBoard[rowIdx] = newRow;
      renderAll();
      updateStatus(`相手陣 ${rowIdx + 1}段目を寄せる`);
    }

    // 自陣：選択札の連続グループ単位で左右寄せ
    function shiftSelfGroup(direction) {
      if (!selectedSlot) {
        updateStatus("自陣の札をタップして選択してから「寄せ」を押してね！");
        return;
      }

      const { r, c } = selectedSlot;
      const row = selfBoard[r];

      if (!row[c]) return;

      let groupStart = c;
      let groupEnd = c;

      while (groupStart > 0 && row[groupStart - 1] !== null) groupStart--;
      while (groupEnd < 14 && row[groupEnd + 1] !== null) groupEnd++;

      const groupCards = row.slice(groupStart, groupEnd + 1);

      if (direction === 'left') {
        let leftSpaceCount = 0;
        for (let i = groupStart - 1; i >= 0; i--) {
          if (row[i] === null) leftSpaceCount++;
        }
        if (leftSpaceCount === 0) {
          updateStatus("これ以上左に寄せられません");
          return;
        }

        const newGroupStart = groupStart - leftSpaceCount;
        for (let i = groupStart; i <= groupEnd; i++) row[i] = null;
        for (let i = 0; i < groupCards.length; i++) {
          row[newGroupStart + i] = groupCards[i];
        }

        selectedSlot.c = newGroupStart + (c - groupStart);

      } else if (direction === 'right') {
        let rightSpaceCount = 0;
        for (let i = groupEnd + 1; i < 15; i++) {
          if (row[i] === null) rightSpaceCount++;
        }
        if (rightSpaceCount === 0) {
          updateStatus("これ以上右に寄せられません");
          return;
        }

        const newGroupEnd = groupEnd + rightSpaceCount;
        const newGroupStart = newGroupEnd - groupCards.length + 1;

        for (let i = groupStart; i <= groupEnd; i++) row[i] = null;
        for (let i = 0; i < groupCards.length; i++) {
          row[newGroupStart + i] = groupCards[i];
        }

        selectedSlot.c = newGroupStart + (c - groupStart);
      }

      renderAll();
      updateStatus("グループを寄せました");
    }

    function resetSelfBoard() {
      if (isMemorizeMode) return;
      let allSelfCards = [];
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 15; c++) {
          if (selfBoard[r][c]) {
            allSelfCards.push(selfBoard[r][c]);
            selfBoard[r][c] = null;
          }
        }
      }
      if (currentCard) allSelfCards.push(currentCard);
      selfDeck = selfDeck.concat(allSelfCards).sort(() => Math.random() - 0.5);
      currentCard = null;
      selectedSlot = null;
      popDeckCard();
      renderAll();
      updateStatus("自陣の札をリセットしました");
    }

    function autoPlaceSelf() {
      if (isMemorizeMode) return;
      let remainingCards = [];
      if (currentCard) remainingCards.push(currentCard);
      remainingCards = remainingCards.concat(selfDeck);
      selfDeck = [];
      currentCard = null;

      let emptySlots = [];
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 15; c++) {
          if (!selfBoard[r][c]) emptySlots.push({ r, c });
        }
      }

      emptySlots.sort(() => Math.random() - 0.5);
      remainingCards.forEach((card, idx) => {
        if (emptySlots[idx]) {
          const { r, c } = emptySlots[idx];
          selfBoard[r][c] = { ...card, isFaceDown: false };
        }
      });

      popDeckCard();
      renderAll();
      updateStatus("自陣を自動配置しました");
    }

    function toggleMemorizeMode() {
      isMemorizeMode = !isMemorizeMode;
      selectedSlot = null;
      const btn = document.getElementById('start-btn');

      if (isMemorizeMode) {
        btn.textContent = "配置モードに戻る";
        setAllFaceDown(true);
        updateStatus("暗記スタート！タップで札をめくれます");
      } else {
        btn.textContent = "暗記スタート (裏返す)";
        setAllFaceDown(false);
        updateStatus("配置モード");
      }
      renderAll();
    }

    function setAllFaceDown(status) {
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 15; c++) {
          if (enemyBoard[r][c]) enemyBoard[r][c].isFaceDown = status;
          if (selfBoard[r][c]) selfBoard[r][c].isFaceDown = status;
        }
      }
    }

    function updateStatus(msg) {
      document.getElementById('status-msg').textContent = msg;
    }

    // 初期化実行
    initGame();
  </script>
</body>
</html>
