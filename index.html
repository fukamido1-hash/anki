<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>競技かるた 暗記＆配置トレーニング</title>
  <style>
    :root {
      --tatami-bg: #d8be92;
      --tatami-border: #6a4f28;
      --card-bg: #fffcf2;
      --card-border: #225128;
      --text-color: #111;
      --grid-border: rgba(100, 70, 30, 0.2);
      --selected: #e74c3c;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 10px;
      background-color: #222;
      color: #fff;
      font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Sawarabi Mincho', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin: 5px 0 10px 0;
      font-size: 1.2rem;
      text-align: center;
    }

    /* ツールバー */
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 10px;
      background: #333;
      padding: 8px 15px;
      border-radius: 8px;
    }

    button {
      background: #38761d;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
    }

    button:hover {
      background: #274e13;
    }

    button.secondary {
      background: #555;
    }

    button.secondary:hover {
      background: #444;
    }

    button.action {
      background: #cc0000;
    }

    button.action:hover {
      background: #990000;
    }

    /* 畳の盤面 */
    .board {
      background-color: var(--tatami-bg);
      border: 10px solid var(--tatami-border);
      border-radius: 4px;
      padding: 8px;
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }

    .field-section {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .section-title {
      color: #3d2b0f;
      font-weight: bold;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }

    .align-btns {
      display: flex;
      gap: 3px;
      flex-wrap: wrap;
    }

    .align-btns button {
      padding: 2px 6px;
      font-size: 0.7rem;
      background: #6a4f28;
    }

    .align-btns button:hover {
      background: #4a3518;
    }

    /* 15マスグリッド行 */
    .row-grid {
      display: grid;
      grid-template-columns: repeat(15, 1fr);
      gap: 2px;
      background: rgba(0,0,0,0.06);
      padding: 2px;
      border-radius: 2px;
    }

    /* マス目 */
    .slot {
      aspect-ratio: 0.7;
      border: 1px dashed var(--grid-border);
      border-radius: 2px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      position: relative;
      background: rgba(255, 255, 255, 0.12);
    }

    .slot:hover {
      background: rgba(56, 118, 29, 0.2);
    }

    /* 札デザイン */
    .card {
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 2px;
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1px;
      box-shadow: 1px 1px 2px rgba(0,0,0,0.3);
      cursor: pointer;
      position: relative;
      font-size: 0.65rem;
      writing-mode: vertical-rl;
      text-orientation: upright;
      letter-spacing: 0.5px;
      font-weight: 500;
      line-height: 1.1;
    }

    /* 敵陣は札が逆さま */
    .enemy-field .card-text {
      transform: rotate(180deg);
    }

    .card.back {
      background: #225128;
      border: 1.5px solid #fff;
    }

    .card.back .card-text {
      display: none;
    }

    .card.selected {
      outline: 2px solid var(--selected);
    }

    /* 中央境界線 */
    .center-divider {
      height: 2px;
      background: var(--tatami-border);
      margin: 2px 0;
      opacity: 0.6;
    }

    /* 山札・ステータスエリア */
    .controls-bottom {
      margin-top: 10px;
      width: 100%;
      max-width: 1000px;
      background: #2a2a2a;
      padding: 8px 15px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .deck-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .deck-card {
      width: 42px;
      height: 60px;
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 3px;
      color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.75rem;
      writing-mode: vertical-rl;
      font-weight: bold;
      box-shadow: 2px 2px 4px rgba(0,0,0,0.4);
      padding: 2px;
    }

    .deck-info {
      font-size: 0.85rem;
    }

    .status-text {
      font-size: 0.9rem;
      color: #f1c40f;
    }
  </style>
</head>
<body>

  <h1>競技かるた 暗記＆配置トレーニング</h1>

  <div class="toolbar">
    <button onclick="initGame()">リセット・新しく並べる</button>
    <button class="secondary" onclick="autoPlaceSelf()">自陣をおまかせ自動配置</button>
    <button class="action" id="start-btn" onclick="toggleMemorizeMode()">暗記スタート (裏返す)</button>
  </div>

  <div class="board">
    <!-- 相手陣 -->
    <div class="field-section enemy-field">
      <div class="section-title">
        <span>相手陣</span>
        <div class="align-btns">
          <button onclick="alignRow('enemy', 0, 'left')">上段左寄</button>
          <button onclick="alignRow('enemy', 0, 'right')">上段右寄</button>
          <button onclick="alignRow('enemy', 1, 'left')">中段左寄</button>
          <button onclick="alignRow('enemy', 1, 'right')">中段右寄</button>
          <button onclick="alignRow('enemy', 2, 'left')">下段左寄</button>
          <button onclick="alignRow('enemy', 2, 'right')">下段右寄</button>
        </div>
      </div>
      <div class="row-grid" id="enemy-row-0"></div>
      <div class="row-grid" id="enemy-row-1"></div>
      <div class="row-grid" id="enemy-row-2"></div>
    </div>

    <div class="center-divider"></div>

    <!-- 自陣 -->
    <div class="field-section self-field">
      <div class="section-title">
        <span>自陣</span>
        <div class="align-btns">
          <button onclick="alignRow('self', 0, 'left')">上段左寄</button>
          <button onclick="alignRow('self', 0, 'right')">上段右寄</button>
          <button onclick="alignRow('self', 1, 'left')">中段左寄</button>
          <button onclick="alignRow('self', 1, 'right')">中段右寄</button>
          <button onclick="alignRow('self', 2, 'left')">下段左寄</button>
          <button onclick="alignRow('self', 2, 'right')">下段右寄</button>
        </div>
      </div>
      <div class="row-grid" id="self-row-0"></div>
      <div class="row-grid" id="self-row-1"></div>
      <div class="row-grid" id="self-row-2"></div>
    </div>
  </div>

  <!-- 下部：自陣配置用コントロール -->

    <div class="deck-area">
      <div class="deck-card" id="current-deck-card">束</div>
      <div class="deck-info">
        <div>自陣山札: <span id="deck-count">25</span> 枚</div>
        <div style="font-size: 0.75rem; color: #bbb;">マス目をタップして配置</div>
      </div>
    </div>
    <div class="status-text" id="status-msg">マス目を選んで札を置いてね</div>
  </div>

    let enemyBoard = Array(3).fill(null).map(() => Array(15).fill(null));
    let selfBoard = Array(3).fill(null).map(() => Array(15).fill(null));
    let selfDeck = [];
    let currentCard = null;
    let isMemorizeMode = false;

    function initGame() {
      isMemorizeMode = false;
      document.getElementById('start-btn').textContent = "暗記スタート (裏返す)";

      // 全100首からシャッフルして50枚を抽出
      const shuffled = [...HYAKUNIN_ISSHU].sort(() => Math.random() - 0.5);
      const enemyCards = shuffled.slice(0, 25);
      selfDeck = shuffled.slice(25, 50);

      enemyBoard = Array(3).fill(null).map(() => Array(15).fill(null));
      selfBoard = Array(3).fill(null).map(() => Array(15).fill(null));

      // 敵陣25枚をランダム配置
      let placed = 0;
      while (placed < 25) {
        let r = Math.floor(Math.random() * 3);
        let c = Math.floor(Math.random() * 15);
        if (!enemyBoard[r][c]) {
          enemyBoard[r][c] = { ...enemyCards[placed], isFaceDown: false };
          placed++;
        }
      }

      popDeckCard();
      renderAll();
    }

    function popDeckCard() {
      if (selfDeck.length > 0) {
        currentCard = selfDeck.pop();
        document.getElementById('current-deck-card').textContent = currentCard.kami;
      } else {
        currentCard = null;
        document.getElementById('current-deck-card').textContent = "完了";
      }
      document.getElementById('deck-count').textContent = selfDeck.length + (currentCard ? 1 : 0);
    }

    function renderAll() {
      renderGrid('enemy', enemyBoard);
      renderGrid('self', selfBoard);
    }

    function renderGrid(side, boardData) {
      for (let r = 0; r < 3; r++) {
        const rowEl = document.getElementById(`${side}-row-${r}`);
        rowEl.innerHTML = '';
        for (let c = 0; c < 15; c++) {
          const slot = document.createElement('div');
          slot.className = 'slot';
          slot.onclick = () => handleSlotClick(side, r, c);

          const cardData = boardData[r][c];
          if (cardData) {
            const card = document.createElement('div');
            card.className = `card ${cardData.isFaceDown ? 'back' : ''}`;

            const text = document.createElement('div');
            text.className = 'card-text';
            text.textContent = cardData.shimo;
            card.appendChild(text);

            slot.appendChild(card);
          }
          rowEl.appendChild(slot);
        }
      }
    }

    function handleSlotClick(side, r, c) {
      const targetBoard = side === 'enemy' ? enemyBoard : selfBoard;

      if (isMemorizeMode) {
        if (targetBoard[r][c]) {
          targetBoard[r][c].isFaceDown = !targetBoard[r][c].isFaceDown;
          renderAll();
        }
        return;
      }

      if (side === 'self') {
        if (!targetBoard[r][c] && currentCard) {
          targetBoard[r][c] = { ...currentCard, isFaceDown: false };
          popDeckCard();
          renderAll();
          updateStatus("札を配置しました");
        }
      }
    }

    function alignRow(side, rowIdx, direction) {
      const board = side === 'enemy' ? enemyBoard : selfBoard;
      const row = board[rowIdx];
      
      const cards = row.filter(c => c !== null);
      const newRow = Array(15).fill(null);

      if (direction === 'left') {
        for (let i = 0; i < cards.length; i++) {
          newRow[i] = cards[i];
        }
      } else {
        for (let i = 0; i < cards.length; i++) {
          newRow[15 - cards.length + i] = cards[i];
        }
      }

      board[rowIdx] = newRow;
      renderAll();
    }

    function autoPlaceSelf() {
      if (isMemorizeMode) return;
      
      let remainingCards = [];
      if (currentCard) remainingCards.push(currentCard);
      remainingCards = remainingCards.concat(selfDeck);
      selfDeck = [];
      currentCard = null;

      let emptySlots = [];
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 15; c++) {
          if (!selfBoard[r][c]) emptySlots.push({ r, c });
        }
      }

      emptySlots.sort(() => Math.random() - 0.5);
      remainingCards.forEach((card, idx) => {
        if (emptySlots[idx]) {
          const { r, c } = emptySlots[idx];
          selfBoard[r][c] = { ...card, isFaceDown: false };
        }
      });

      popDeckCard();
      renderAll();
      updateStatus("自陣を自動配置しました");
    }

    function toggleMemorizeMode() {
      isMemorizeMode = !isMemorizeMode;
      const btn = document.getElementById('start-btn');

      if (isMemorizeMode) {
        btn.textContent = "配置モードに戻る";
        setAllFaceDown(true);
        updateStatus("暗記スタート！札をタップするとめくれます");
      } else {
        btn.textContent = "暗記スタート (裏返す)";
        setAllFaceDown(false);
        updateStatus("配置モード");
      }
      renderAll();
    }

    function setAllFaceDown(status) {
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 15; c++) {
          if (enemyBoard[r][c]) enemyBoard[r][c].isFaceDown = status;
          if (selfBoard[r][c]) selfBoard[r][c].isFaceDown = status;
        }
      }
    }

    function updateStatus(msg) {
      document.getElementById('status-msg').textContent = msg;
    }

    initGame();
  </script>
</body>
</html>
